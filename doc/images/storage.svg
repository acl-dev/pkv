<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">PKV · 原生分页存储 / Native paged storage</title><desc id="desc">Logical keys own roots and private pages; physical pages never appear as user keys.</desc>
<rect width="1200" height="800" rx="20" fill="#f8fafc"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="40" y="48" font-size="27" font-weight="700" fill="#0f172a">PKV · 原生分页存储 / Native paged storage</text>
<text x="40" y="79" font-size="16" fill="#475569">Logical keys own roots and private pages; physical pages never appear as user keys.</text>
<path d="M172.0,215.0 L172.0,265.0" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="172.0,265.0 176.0,257.0 168.0,257.0" fill="#64748b"/>
