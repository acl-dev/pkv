<polygon points="172.0,485.0 176.0,477.0 168.0,477.0" fill="#64748b"/>
<path d="M457.0,430.0 L457.0,485.0" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="457.0,485.0 461.0,477.0 453.0,477.0" fill="#64748b"/>
<path d="M742.0,430.0 L742.0,485.0" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="742.0,485.0 746.0,477.0 738.0,477.0" fill="#64748b"/>
<path d="M1027.0,430.0 L1027.0,485.0" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="1027.0,485.0 1031.0,477.0 1023.0,477.0" fill="#64748b"/>
<rect x="40" y="115" width="1120" height="100" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="60" y="146" font-size="19" font-weight="700" fill="#0f172a">逻辑数据库 / Logical databases</text>
<text x="60" y="174" font-size="16" fill="#334155">Connection SELECT → database_pool → independent DB 0 … DB N</text>
<text x="60" y="198" font-size="16" fill="#334155">databases: logical DB count (default 16) · db_count: physical memory shards within each DB</text>
<rect x="40" y="265" width="265" height="165" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="60" y="296" font-size="19" font-weight="700" fill="#0f172a">String · PSR</text>
<text x="60" y="324" font-size="16" fill="#334155">≤ 1024 bytes inline</text>
<text x="60" y="348" font-size="16" fill="#334155">Larger: 16 KiB chunks</text>
<text x="60" y="372" font-size="16" fill="#334155">Range access by chunk</text>
<rect x="325" y="265" width="265" height="165" rx="12" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="345" y="296" font-size="19" font-weight="700" fill="#0f172a">List · PLR</text>
<text x="345" y="324" font-size="16" fill="#334155">Packed endpoint pages</text>
<text x="345" y="348" font-size="16" fill="#334155">Large elements fragmented</text>
<text x="345" y="372" font-size="16" fill="#334155">Push / pop at boundaries</text>
<rect x="610" y="265" width="265" height="165" rx="12" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="630" y="296" font-size="19" font-weight="700" fill="#0f172a">Hash / Set · PMR</text>
<text x="630" y="324" font-size="16" fill="#334155">AVL nodes + fragments</text>
<text x="630" y="348" font-size="16" fill="#334155">Hash: fields and values</text>
<text x="630" y="372" font-size="16" fill="#334155">Set: membership entries</text>
<rect x="895" y="265" width="265" height="165" rx="12" fill="#fce7f3" stroke="#cbd5e1"/>
<text x="915" y="296" font-size="19" font-weight="700" fill="#0f172a">ZSet · PZR</text>
<text x="915" y="324" font-size="16" fill="#334155">Member + score indexes</text>
<text x="915" y="348" font-size="16" fill="#334155">One coordinated family</text>
<text x="915" y="372" font-size="16" fill="#334155">Also used by GEO</text>
<rect x="40" y="485" width="1120" height="105" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="60" y="516" font-size="19" font-weight="700" fill="#0f172a">原子提交 / Atomic commit</text>
<text x="60" y="544" font-size="16" fill="#334155">Root changes + page writes/deletes commit together in a supported atomic domain</text>
<text x="60" y="568" font-size="16" fill="#334155">Memory prepare/publish · RocksDB WriteBatch · WiredTiger snapshot transaction</text>
<rect x="40" y="635" width="1120" height="90" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="60" y="666" font-size="19" font-weight="700" fill="#0f172a">兼容路径 / Compatibility path</text>
<text x="60" y="694" font-size="16" fill="#334155">Legacy JSON → codec-owned record_view → typed import → native pages</text>
<text x="60" y="718" font-size="16" fill="#334155">Migration retains absolute expiry; unsupported/future formats fail explicitly.</text>
<text x="40" y="757" font-size="15" fill="#475569">16 KiB bounds physical pages, not command work or total response/transaction memory.</text>
<text x="40" y="780" font-size="15" fill="#475569">Single-instance disk commits are atomic; independent disk stores require separate coordination.</text>
</g></svg>
